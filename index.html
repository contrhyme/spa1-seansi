<body>
<title>SPA 1 Seansı</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Düzen: tek sütun telefon masası; üstte seans şeridi, altta sekme çubuğu. Sinyal rengi amber, baraj çizgileriyle aynı dil. */
:root{--bg:#EBEFF3;--card:#FBFCFD;--ink:#13212E;--mute:#5A6B7A;--line:#D3DBE3;--accent:#0A6C6E;--accent-ink:#FFFFFF;--amber:#A86500;--amber-bg:#FBEFD8;--ok:#177A50;--ok-bg:#DFF3E9;--bad:#B5352F;--bad-bg:#F9E3E1;--tint:#DCEBEB;
--disp:"Bricolage Grotesque","IBM Plex Sans",system-ui,sans-serif;--body:"IBM Plex Sans",system-ui,-apple-system,sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1821;--card:#17232E;--ink:#E7EDF2;--mute:#9AABB9;--line:#2B3A47;--accent:#3EC0B4;--accent-ink:#06211F;--amber:#F2B441;--amber-bg:#3A2C10;--ok:#4FCB94;--ok-bg:#12352A;--bad:#F08A82;--bad-bg:#3D1F1D;--tint:#16343A;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F1821;--card:#17232E;--ink:#E7EDF2;--mute:#9AABB9;--line:#2B3A47;--accent:#3EC0B4;--accent-ink:#06211F;--amber:#F2B441;--amber-bg:#3A2C10;--ok:#4FCB94;--ok-bg:#12352A;--bad:#F08A82;--bad-bg:#3D1F1D;--tint:#16343A;color-scheme:dark}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:400 16px/1.55 var(--body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 170px}
#app{max-width:600px;margin:0 auto}
h1,h2,h3{font-family:var(--disp);line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:30px;font-weight:800;letter-spacing:-.02em}h2{font-size:21px;font-weight:700}h3{font-size:17px;font-weight:700}
p{margin:0}b{font-weight:600}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.strip{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0 10px;font:600 13px/1.2 var(--mono);color:var(--mute)}
.strip .t{color:var(--amber)}
.stack{display:grid;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:10px;min-width:0}
.card.go{background:var(--accent);color:var(--accent-ink);border-color:transparent}.card.go .sub{color:inherit;opacity:.85}
.card.warn{background:var(--amber-bg);border-color:transparent}
.sub{color:var(--mute);font-size:14px}
.eyebrow{font:600 12px/1.2 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
.btn{display:block;width:100%;background:var(--accent);color:var(--accent-ink);font-weight:600;border-radius:10px;padding:13px 14px;text-align:center;min-height:48px}
.btn.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
.card.go .btn{background:var(--accent-ink);color:var(--accent)}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>.btn{flex:1 1 140px;width:auto}
a{color:var(--accent);font-weight:500}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px;border-radius:6px}
.li{display:flex;gap:12px;align-items:center;width:100%;padding:12px 0;border-top:1px solid var(--line);min-height:52px}
.li:first-child{border-top:0}.li .m{flex:1;min-width:0}.li .tt{font-weight:600}.li .ss{color:var(--mute);font-size:13px}
.dot{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-size:13px}
.dot.on{background:var(--ok);border-color:var(--ok);color:var(--card)}
.chip{display:inline-block;font:600 12px/1 var(--mono);padding:5px 7px;border-radius:6px;background:var(--tint);color:var(--ink)}
.chip.a{background:var(--amber-bg);color:var(--amber)}.chip.b{background:var(--bad-bg);color:var(--bad)}.chip.g{background:var(--ok-bg);color:var(--ok)}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent)}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.nav div{display:grid;grid-template-columns:repeat(5,1fr);width:100%;max-width:600px}
.nav button{font:600 12px/1.2 var(--body);text-align:center;color:var(--mute);padding:9px 2px;border-radius:8px;min-height:44px}
.nav button.on{color:var(--accent);background:var(--tint)}
.player{position:fixed;left:0;right:0;bottom:calc(62px + env(safe-area-inset-bottom,0px));z-index:19;display:flex;justify-content:center;padding:0 max(12px,env(safe-area-inset-right,0px)) 8px max(12px,env(safe-area-inset-left,0px));pointer-events:none}
.player>div{pointer-events:auto;background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 12px;width:100%;max-width:600px;display:grid;gap:8px}
.player .now{font-size:13px;line-height:1.35;max-height:3.9em;overflow:hidden}
.player .ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.player button{background:rgba(127,127,127,.28);color:inherit;border-radius:7px;padding:6px 10px;font:600 13px/1.2 var(--mono);min-height:34px}
.player button.on{background:var(--amber);color:#1b1200}
.notes{display:grid;gap:10px;margin:0;padding:0;list-style:none}.notes li{padding-left:14px;border-left:2px solid var(--line)}
.must{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;padding:13px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);min-height:50px}
.opt .k{font:600 14px/1.5 var(--mono);color:var(--mute);flex:none;width:18px}
.opt span:last-child{min-width:0}
.opt.sel{border-color:var(--accent);background:var(--tint)}.opt.ok{border-color:var(--ok);background:var(--ok-bg)}.opt.no{border-color:var(--bad);background:var(--bad-bg)}
.fb{border-radius:10px;padding:13px;background:var(--tint);display:grid;gap:8px}.fb.ok{background:var(--ok-bg)}.fb.no{background:var(--bad-bg)}
.score{font:800 56px/1 var(--disp);letter-spacing:-.03em}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--line);font-size:15px}.kv:first-child{border-top:0}.kv span:last-child{font-family:var(--mono);font-weight:600;text-align:right}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}.tabs button{flex:none;padding:8px 11px;border-radius:8px;border:1px solid var(--line);font-size:14px;font-weight:500;min-height:40px}.tabs button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chart text{font:600 11px var(--mono);fill:var(--mute)}.chart .l50{stroke:var(--bad)}.chart .l60{stroke:var(--amber)}.chart .l70{stroke:var(--ok)}.chart .p{stroke:var(--accent);fill:none;stroke-width:2.5}.chart circle{fill:var(--accent)}
input,select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px;width:100%;min-height:44px}
.back{font-weight:600;color:var(--accent);padding:6px 0;min-height:40px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--bg);padding:9px 13px;border-radius:9px;font-size:14px;max-width:88vw}
.days{display:grid;gap:0}
@media (prefers-reduced-motion:no-preference){.opt{transition:background .12s,border-color .12s}}
</style>

<script>
const DATA={"L":[{"id":"p1","t":"pay","day":1,"ref":"1.1–1.3","title":"Anonim şirket ve pay","pts":["Anonim şirket (TTK 329): sermayesi belirli, paylara bölünmüş, borcundan yalnız malvarlığıyla sorumlu şirket. Halka açılmaya elverişli tek sermaye şirketi türüdür.","Pay sahipliği şirket malvarlığı üzerinde mülkiyet vermez; şirkete karşı ortaklık hakkı verir. Ortağın tek borcu taahhüt ettiği sermayeyi ödemektir.","İki zorunlu organ: **genel kurul** (en üst karar organı; YK seçer, ibra eder, kâr dağıtımını onaylar) ve **yönetim kurulu** (yönetim ve temsil). Murakıplık 6102 sayılı TTK ile kalktı.","Halka açık ortaklıkta bağımsız üyeler Türkiye'de yerleşik gerçek kişilerdir. Komiteler (denetim, riskin erken saptanması, kurumsal yönetim) organ değildir.","Tasfiyede sıra: devlet borçları, çalışan hakları ve borçlanma aracı sahipleri önce; pay sahibi en sonda kalan değere hak kazanır.","Nominal değer TTK 476'ya göre 1 kuruştan az olamaz; borsada genellikle 1 TL'dir.","Pay ortaklığa karşı bölünmez; birden fazla sahip ortak temsilci atar.","Sermaye piyasası aracı üst kavramı: menkul kıymetler, türev araçlar, diğer araçlar. Menkul kıymet tanımına para, çek, poliçe ve bono girmez. Her A.Ş. payı sermaye piyasası aracı değildir."],"must":["İflas eden şirketin bedeli tam ödenmiş ortağının kişisel malvarlığına gidilemez.","Pay Kanun'da değil, VII-128.1 Pay Tebliği'nde tanımlanır."],"mn":"Sırayı \"Devlet-Çalışan-Tahvilci-Ortak\" diye kısalt: ortak hep sonda, bu yüzden risk de getiri de onda."},{"id":"p2","t":"pay","day":1,"ref":"1.4","title":"Pay türleri","pts":["**Adi pay** eşit hak verir; esas sözleşmede aksi yoksa bütün paylar adidir. **İmtiyaz** kâr payı, tasfiye payı, rüçhan ve oyda tanınır; kural olarak paya verilir.","Oyda imtiyazla bir paya, istisnalar hariç, en çok **15 oy** verilebilir. Esas sözleşme değişikliği, ibra ve sorumluluk davası kararlarında oyda imtiyaz kullanılamaz.","**Bedelsiz pay**: iç kaynak ve kâr payından, şirkete para girmez. **Bedelli pay**: nakit artırımla, yeni fon sağlar. Birleşmede devrolan şirket ortaklarına verilen pay da bedelli sayılır.","**Primli pay** nominalin üzerinde çıkar; fark **emisyon primi** olarak özkaynakta izlenir. Borsada işlem gören ortaklıklar nominal altı da ihraç edebilir.","**İntifa payı**: bedeli yok edilen pay sahipleri, alacaklılar veya benzeri kişiler için. Kuruluşta hizmeti olanlara verilirse kurucu intifa payı olur; pay sahipliği hakkı verilemez.","**Geri alınan paylar** (II-22.1): özkaynak indirimi; oy donuk, kâr payı ve bedelsiz hakkı saklı; rüçhan kullanılamaz, ilgili pazarda satılır (1.4.5). Kaynağın 3.5 bölümü ise kâr payı ve rüçhan hakkı verdiğini yazar; iki ifade farklıdır, sınavda güncel Tebliği esas al. Tedavüldeki pay = toplam sermaye − geri alınan pay.","**Fiili dolaşım** dışı: kamu tüzel kişileri, kurucular ve yakın aile, %10 ve üzeri ortaklar, YK üyeleri ve üst yöneticiler, şirket sandık-vakıfları, teminatlı-kısıtlı-hacizli paylar.","Piyasa değeri = toplam pay × güncel fiyat. BIST endeks ağırlığı toplam sermayeye değil fiili dolaşımdaki paylara göre bulunur."],"must":["Kurucu intifa sahibi genel kurulda oy kullanamaz; ekonomik hak alabilir.","Geri alımdan sonra hisse başına kazanç, kâr daha az paya bölündüğü için yükselir.","Hakim ortak, YK ve hacizli pay fiili dolaşıma girmez."],"mn":"\"15 oy, 3 yasak\": esas sözleşme değişikliği, ibra, sorumluluk davası. Parmakla say."},{"id":"p3","t":"pay","day":1,"ref":"1.5–1.7","title":"Değer, kaydi sistem, pay hakları","pts":["Beş değer: **nominal** (hukuki), **defter** (özkaynak / pay sayısı), **tasfiye** (varlıklar cari değerden satılıp borç düşülünce kalan; genelde alt sınır), **piyasa** (borsa fiyatı), **içsel** (gelecekteki nakit akışına göre olması gereken).","SPKn md. 13: elektronik ortamda kayden ihraç esastır. Mülkiyet MKK'da hak sahibi bazında izlenir, devir MKK kaydıyla olur.","Kurul kararıyla kayden izleme dışında kalanlar: yalnız ortak sayısı nedeniyle halka açık sayılıp borsada işlem görmeyenler ve kooperatif kontrolündekiler.","**Altı mali hak**: kâr payı, rüçhan, bedelsiz pay, tasfiye bakiyesi, ayrılma, satma.","**İki yönetimsel hak**: genel kurula katılma ve oy, bilgi alma ve inceleme.","Halka açık şirkette sermayenin **%5**'i azınlık sayılır: genel kurulu çağırma, gündeme madde ekletme, özel denetçi isteme."],"must":["Defter değeri = (toplam varlık − toplam borç) / pay sayısı.","Fiziki hisse senedi talebi karşılanamaz.","Satma hakkı eşiği: oy haklarının en az %98'i."],"mn":"Mali haklar: \"KaRBeTAS\" = Kâr, Rüçhan, Bedelsiz, Tasfiye, Ayrılma, Satma."},{"id":"p4","t":"pay","day":1,"ref":"1.8","title":"Getiri, risk, yatırımcı davranışı","pts":["Getiri iki yoldan gelir: temettü ve sermaye kazancı. Kazanç satılana kadar gerçekleşmemiştir. Temettü verimi = hisse başına temettü / fiyat.","Kâr dağıtımı YK teklifi üzerine genel kurulda karara bağlanır (II-19.1).","**Sistematik risk**: piyasa, faiz, enflasyon, döviz kuru, politik. Çeşitlendirmeyle yok edilemez; beta ile ölçülür.","**Sistematik olmayan risk**: ihraççı, sektörel, likidite. Çeşitlendirmeyle önemli ölçüde azalır.","Faiz artınca iskonto oranı ve borçlanma maliyeti yükselir, sabit getirili araçlar cazipleşir; hisse değeri genellikle düşer.","Altı davranış eğilimi: sürü, aşırı güven, kayıptan kaçınma, çapalama, doğrulama yanlılığı, temsil.","Sert düşüş riski azaltmaz; oynaklık yükseldiği için hisse teknik olarak daha risklidir. Halka arz sonrası dalgalanma fiyat keşfidir.","Koruma katmanları: bilgilendirme ve risk bildirim formu; uygunluk testi (uygun değilse uyarı, talimatla işlem olabilir); yerindelik testi (danışmanlık-portföy yönetiminde daha koruyucu); devre kesici, VBTS; Takasbank, MKK, YTM."],"must":["Çapalama: ilk bilgiye (alış fiyatı ya da geçmiş zirve) takılı kalmak; koşullar değişse de referans değişmez."],"mn":"Sistematik riskler için \"PFEDP\": Piyasa, Faiz, Enflasyon, Döviz, Politik. Şirkete özgüler için \"İSL\": İhraççı, Sektör, Likidite."},{"id":"p5","t":"pay","day":1,"ref":"1.9–1.10","title":"Endeksler ve yüksek frekanslı işlem","pts":["BIST 30 VİOP endeks sözleşmelerinin dayanağıdır. BIST Tüm; Yıldız, Ana ve Alt Pazar şirketlerini kapsar.","Temel endeksler **fiili dolaşım piyasa değeri ağırlıklıdır**. Dow Jones gibi bazı uluslararası endeksler fiyat ağırlıklıdır.","Endeks değeri = fiili dolaşımdaki payların toplam piyasa değeri / bölen değeri. Bölen, yapay sıçramaları önler. Bileşenler üç ayda bir güncellenir.","**Fiyat endeksi** (BIST 100): temettü dahil değil, temettü sonrası düşüşü yansıtır. **Getiri endeksi**: temettü yeniden yatırılmış sayılır.","Bedelsiz artırım piyasa değerini değiştirmediği için endeksi etkilemez.","YFİ mikrosaniyeyle ölçülür; eş-yerleşim (kolokasyon) kullanır; emir/işlem oranı yüksektir.","YFİ yöntemleri: piyasa yapıcılığı, istatistiksel arbitraj, gecikme arbitrajı."],"must":["Standart BIST 100'de ağırlık sınırı yoktur; %10 veya %25 sınırlı ayrı endeksler vardır.","Baz 100 ise, endeksin 100'den farkı yüzde değişimdir."],"mn":"Getiri endeksini \"temettü geri cebe, cep yine endekse\" diye düşün."},{"id":"p6","t":"pay","day":2,"ref":"2.1","title":"İzahname ve ihraç belgesi (II-5.1)","pts":["Halka arz veya borsada işlem görme için izahname ve Kurul onayı zorunludur. Onaysız halka arz hapis ve adli para cezası gerektiren suçtur.","Muafiyet (2026): yatırımcı başına en az **9.500.000 TL**, birim nominal en az **9.500.000 TL**, nitelikliler arası borsa işlemi, belirli birleşme-bölünme hâlleri.","İlk halka arz hariç, toplam satış bedeli **142.500.000 TL** altında ihraççının talebiyle Kurul muafiyet verebilir.","Çok belgeli izahname: **İBD + SPAN + Özet**. Özette dış bilgilere atıf yapılamaz.","Pay gibi araçlarda son **3 yıl** finansal tablo. Ek değişiklikte talep geri alma süresi **2 iş günü**.","Geçerlilik **12 ay**. İlan: teslimden **15 iş günü** içinde site ve KAP. Tescil-TTSG: **10 iş günü**; satışa başlamak için tescil gerekmez.","**İhraç belgesi**: halka arz edilmeksizin ihraç, yurt dışı ihraç, duyuru metni hariç izahnamesiz ihraçlar. Ticaret siciline tescil edilmez.","Kurul incelemesi **10 iş günü**, ilk halka arzda **20 iş günü**. Onay doğruluk garantisi değildir, reklamda kullanılamaz."],"must":["Birincil sorumlu ihraççıdır. Tazmin edilemezse halka arz eden, lider yetkili kuruluş, garantör ve YK üyeleri kusurlarına göre sorumludur.","Yalnız özete dayanarak sorumluluk yüklenemez; özet diğer kısımlarla birlikte yanıltıcıysa bu kural geçerli değildir.","Tahsisli ve nitelikli satışta izahname yerine ihraç belgesi hazırlanır."],"mn":"Süre zinciri \"10-20 / 15 / 10\": Kurul 10 (ilk arzda 20), ilan 15, tescil 10."},{"id":"p7","t":"pay","day":2,"ref":"2.2.1–2.2.3","title":"İlk halka arz şartları ve sonrası","pts":["**İhraççı** payı çıkaran şirket, **halka arz eden** payını satan ortaktır. Yöntem: sermaye artırımı (para şirkete), mevcut pay satışı (para ortağa) ya da ikisi.","Ön koşul: sermaye tam ödenmiş; ilişkili taraflardan ticari olmayan alacak tüm alacakların %20'sini, aktifin %10'unu aşmamalı.","2026 başvurusunda iki ölçütten biri, iki yıl birlikte: **aktif** 2024 için 2,4 milyar, 2025 için 3,6 milyar TL; **net hasılat** 2024 için 1,2 milyar, 2025 için 1,8 milyar TL.","**Yüklenim** (2026): 750 milyon TL altı tamamı; 750 milyon-1,5 milyar arası ilk 750 milyon tamamı, aşanın yarısı; 1,5 milyar üstü zorunluluk yok.","Yüklenimle alınan paylar **6 ay** halka arz fiyatının altında borsada satılamaz.","Satış kısıtı: %10 ve üzeri ortak-kontrol sahibi **1 yıl** arz fiyatının altında borsada satamaz; mevcut ortaklar izahname onayından **180 gün**, borsa dahil; arzdan alan yatırımcı hesaba geçişten **90 gün** borsa dışı satış, virman, özel emir ve toptan satış yapamaz.","**Satışa hazır bekletilen pay**: arz büyüklüğü 950 milyon TL altındaysa ek satış hariç nominalin %25'i. KAP ilanından 1 yıl, fiyat arz fiyatının %25 fazlasını aşmadıkça satılamaz; satılmazsa iptal.","**Fiyat istikrarı**: azami fon brüt arz gelirinin %20'si, azami pay nominalin %20'si, en çok 30 gün, arz fiyatı üstünde alım emri yok."],"must":["Kısmi yüklenim tutarı = 750 milyon + (büyüklük − 750 milyon) / 2. Büyüklük ek satış hariç, arz fiyatından hesaplanır.","Fiyat istikrarı: \"%20, %20, 30 gün\"."],"mn":"Üç kısıtı kişiye bağla: Büyük ortak 1 yıl, Mevcut ortak 180, Yatırımcı 90. \"Kim daha içerdeyse daha uzun bekler.\""},{"id":"p8","t":"pay","day":2,"ref":"2.2.4–2.2.5","title":"Artırım türleri, ön talep, ek satış, raporlar","pts":["Halka açık ortaklıkta bedelli artırımda sermaye borcu nakit ödenir. Fon mevcut sermayeyi aşıp ilişkili taraf borcuna gidiyorsa işlem önemli sayılır; muhaliflere ayrılma hakkı doğar.","**Şarta bağlı artırım**: kayıtlı sermayede; borçlanma aracı alacaklısı, ortaklık varantı sahibi veya çalışan haklarına karşı. Yeni pay alma hakkı tamamen kısıtlanır.","**Nominal altı ihraç**: duyurudan önceki 30 gün ağırlıklı ortalama fiyat ortalaması nominalin altındaysa. Tescil nominalden yapılır; imtiyaza son verilir veya alım teklifi yapılır; halka arzda kontrol sahipleri rüçhanı tam kullanır ve 1 yıl borsada satamaz; risk bildirim formu imzalatılır.","**Ön talep toplama**: izahname onayından önce, bağlayıcı değil, en çok **10 iş günü**; sonuçlar açıklanamaz, reklamda kullanılamaz.","**Ek pay**: ek satış öncesi nominalin en çok **%20**'si; mevcut ortak satar ya da aracı kurum ortaklardan ödünç alıp satar.","**Fiyat tespit raporu** arzdan en az 3 gün önce ilan edilir. Değerlendirme raporu: 1 yılda en az iki; ilki 6 ay sonra, arası en az 4 ay.","Pay sahibi sayısı **500**'ü aşarsa payları halka arz olunmuş sayılan ortaklık statüsü gündeme gelir.","İşlem görmeyen payın işlem görür niteliğe dönüşümü: MKK'ya talep; KAP duyurusundan 2 iş günü sonra satılabilir."],"must":["Ek satış tavanı %20; kaynak mevcut ortak veya ödünç alımlı satıştır."],"mn":"\"Ön talep 10 gün konuşur, sonucu susar\": ne açıklanır ne reklam olur."},{"id":"p9","t":"pay","day":2,"ref":"2.3.1–2.3.2","title":"Satış tebliği: tahsisli ve nitelikli satış (II-5.2)","pts":["Fiyat, satış şekli ve dağıtım esaslarını kural olarak ihraççı/halka arz eden belirler. Araç MKK hesabına geçince satış tamamlanır.","Blokaj: BIST-30 payı, para piyasası fonu, kamu borçlanma aracı, döviz, mevduat, borsada işlem gören özel sektör aracı, kira sertifikası gibi likit varlıklarla talep.","Nitelikli yatırımcıya satılan araçlar yalnız nitelikliler arasında Girişim Sermayesi Pazarı'nda işlem görebilir. Tahsisli satılan araçların borsada işlem görmemesi esastır.","**Tahsisli satış**: aracı aynı anda elinde tutan yatırımcı en çok **150**. Nitelikli yatırımcılar sayıma girmez.","150 aşılırsa MKK derhal ihraççı ve Kurula bildirir; ihraççı **20 iş günü** içinde izahname için Kurula, işlem görme için borsaya başvurur.","**Nitelikli satış**: yatırımcı sayısında sınır yok. Tek kuruluşun kaydı yeterli; müşterek hesapta tüm sahipler nitelikli olmalı; kurumsal yatırımcı beyansız eklenir."],"must":["Müşterek hesap sahipleri ayrı ayrı sayılır; yalnız gün sonu bakiyesi olan hesap dikkate alınır."],"mn":"\"150 kişi, 20 gün\": 150'yi aşan 20 günde izahnameye koşar."},{"id":"p10","t":"pay","day":2,"ref":"2.3.3","title":"Halka arzda dağıtım","pts":["Üç satış yöntemi: talep toplama, talep toplanmaksızın (istisnai), borsada satış. Borsa dışı talep toplama: sabit fiyat, fiyat teklifi, fiyat aralığı.","Borsa dışı sabit fiyat: yurt içi bireysel asgari **%10**, yurt içi kurumsal asgari **%10** tahsisat. Grup kaydırmada bir grup en çok %20 azaltılır. Süre **2-20 iş günü**.","**Eşit dağıtım**: gruba ayrılan pay ÷ yatırımcı sayısı; bu miktara kadar isteyen tam alır; kalan, karşılanmayanlara yeniden bölünür. **Oransal**: arz / talep oranı.","Mükerrer talep (borsa dışı eşit dağıtım): yalnız en yüksek talep dikkate alınır.","**Borsada sabit fiyat (SFY)**: BISTECH, tahsisat yok, en çok **3 iş günü**, genellikle 10:30-13:00, İKG emir, tek kural zaman önceliği.","SFY dağıtımı: MKK sicilinde tekleştirme, ilk emir kalır; talep fazlaysa zaman öncelikli **dairesel 1'er lot**. Takas T+2.","İlke Kararı (i-SPK.128.23): **750 milyon TL** ve altı arzda borsada satış zorunlu. Üstünde borsa dışı talep toplama kullanılırsa bireysele eşit dağıtım; yüksek talep grubu en çok %10, oransalda nakit ve/veya %120 BIST 30 teminat, yatırımcı başına grubun 1/4'ü.","Kurumsal grupta fonlara en az %50; kurumsal başına en çok %1; PYŞ'nin fonları için %3; PYŞ'nin kendi talebi %2.","İçsel bilgiye ulaşabilenler listesi ve yakınları yalnız bireysel gruptan talep verebilir."],"must":["SFY'de en yüksek talep kuralı yoktur; aynı yatırımcının farklı kurumlardan emirlerinde yalnız ilk emir geçer.","Eşit dağıtım hesabını elle çalış: kişi başı payı bul, altında kalanları düş, kalanı böl."],"mn":"Borsa dışı \"EN YÜKSEK\", borsa \"EN ÖNCE\": iki kuralı kelime çiftiyle ayır."},{"id":"p11","t":"pay","day":3,"ref":"3.1–3.2","title":"Temettü ve bedelli artırım","pts":["Kâr payı kararını yalnız **genel kurul** alır; dağıtım en geç hesap dönemi sonuna kadar başlar.","Tarihler: **hak kullanım** (temettüsüz ilk gün, fiyat düzeltmesi), **kayıt** (ertesi iş günü, MKK kesinleştirir), **ödeme**.","Teorik fiyat Ft = Fk − brüt temettü. Stopaj **%15**; net = brüt × 0,85. Temettünün **%50**'si istisnadır; kalan 2025 için 330.000 TL'yi aşarsa beyan edilir.","Taksitte her taksidin ayrı hak kullanım tarihi var; hisse bir önceki iş günü kapanışında portföyde olmalı. Tahsil edilmeyen kâr payı **5 yılda** zamanaşımına uğrar, Hazine'ye geçer.","**Rüçhan**: ilan sonrası **10 gün** içinde başlar; kullanım süresi **15-60 gün**. Hisse, kayıt tarihinden iki iş günü önce kapanışta portföyde olmalı.","Teorik fiyat Ft = (Fk + n×R) / (1+n); rüçhan değeri Fr = (Ft − R) × n. %200 artırımda n = 2.","Rüçhan pazarı kapansa da hak bitmez; süre sonuna kadar bedel ödenerek kullanılabilir. Hiçbir şey yapmazsan hak iptal olur.","Kalan paylar: borsada satış zorunlu, 10 iş günü içinde başlar, nominal altı olmaz, satılmayan iptal. Emisyon primi = (satış − nominal) × adet.","Vergi: rüçhanı kullanmak vergisiz; satış kazancı G67 kapsamında %0. MKYO payları %10."],"must":["Temettüde Ft = kapanış − brüt; net = brüt − stopaj.","Bedelli teorik fiyat ve Fr formülünü üç kez çözmeden geçme."],"mn":"Bedelli formülünü \"eski para + yeni para ÷ yeni pay sayısı\" diye oku: 1 eski pay Fk, n yeni pay n×R, toplam 1+n pay."},{"id":"p12","t":"pay","day":3,"ref":"3.3–3.5","title":"Bedelsiz, sermaye azaltımı, geri alım","pts":["Bedelsizde şirkete nakit girmez; sahiplik oranı değişmez. Ft = Fk / (1+n). %400 artırımda bölen 5.","Sermayeye eklenemez: değer artış fonları, ara dönem kârları, mevzuatın izin vermediği fon ve yedekler. Önce geçmiş yıl zararları kapatılır veya genel kurulda kapatılacağına dair YK kararı Kurula verilir.","Dönem kârı hariç iç kaynakta düzeltilmiş fiyat **2 TL**'nin altına düşüyorsa başvuru işleme alınmaz.","Bölünme gününde alan bedelsiz hak kazanmaz; hak satana aittir. Hisse, kayıt tarihinden iki iş günü önce kapanışta portföyde olmalı.","**Fon çıkışı gerektiren azaltım** TTK'dadır. **Gerektirmeyen azaltım** Pay Tebliği'nde: bilanço açığı kapatma ve geri alınan payların itfası. Bilanço açığı kapatmada düzeltilmiş fiyat nominalin %20 üzerini aşamaz.","Azaltımda Ft = Fk / (1 − oran), pay sayısı × (1 − oran). Yatırımcının varlığı değişmez.","**Geri alım** (II-22.1): program genel kuruldan en az **3 hafta** önce duyurulur; işlemden 2 iş günü önce açıklama. Günlük alım son 20 gün ortalama hacmin %25'ini geçemez.","Geri alınan nominal sermayenin **%10**'unu aşamaz; genel kurul nisabında sayılmaz; kaynağın 3.5 bölümüne göre kâr payı ve rüçhan dışında hak vermez (1.4.5 bölümü farklı yazar, bkz. Pay türleri).","Program sürerken kontrol sahipleri ve idari sorumlular borsada satamaz. Alım emri son fiyat veya en iyi satıştan yüksek olamaz."],"must":["Üç teorik fiyat: temettü (eksi), bedelsiz (böl 1+n), azaltım (böl 1−oran)."],"mn":"Bedelsiz \"pasta dilimlenir\", azaltım \"dilimler birleşir\": toplam değer aynı kalır."},{"id":"p13","t":"pay","day":3,"ref":"3.6","title":"Azınlığın üç çıkış hakkı","pts":["**Zorunlu pay alım teklifi (II-26.1)**: oy haklarının %50'sinden fazlası ya da YK çoğunluğunu seçme hakkı. Payı yeni hâkim ortak alır.","Teklif fiyatı: son 6 ayda ödenen en yüksek bedel ile son 6 aylık günlük düzeltilmiş AOBF ortalamasından yüksek olanın altına inemez. Süreç genellikle: 6 iş günü başvuru, 2 ay içinde çağrı, 10-20 iş günü kabul.","Yükümlülük yerine getirilmezse faiz ödenir, oy hakları kendiliğinden donar.","**Ayrılma hakkı (II-23.3)**: birleşme, bölünme, tür değiştirme, önemli malvarlığı devri, faaliyet konusu değişikliği, imtiyaz. Payı **şirket** alır.","Şart: açıklama tarihinde pay sahibi olmak, genel kurulda olumsuz oy, muhalefet şerhi. Fiyat Yıldız Pazar'da son 1 ay, diğerlerinde son 6 ay ortalaması. Süreç genel kuruldan en geç 6 iş günü sonra başlar, 10 iş günü içinde biter.","**Satma ve çıkarma (II-27.3)**: oy haklarının en az **%98**'i. Çift yönlü hak. Payı hâkim ortak alır.","Azınlık genel kurula katılmak zorunda değil; değerleme özeti açıklamasını izleyen gün başlayan **2 aylık** hak düşürücü sürede şirkete yazılı talep verir.","Fiyat iki değerden yüksek olanı: pazar ortalaması ile değerleme raporu ortalaması; kontrol değişikliğiyle aynı anda kazanılmışsa zorunlu çağrı fiyatı."],"must":["Payı kim alır: çağrıda yeni hâkim, ayrılmada şirket, satmada hâkim ortak.","Ayrılma için üç şart birlikte aranır."],"mn":"Eşik merdiveni: **50 üstü → teklif, 98 → satma**. Ayrılma eşikten değil, işlemden doğar."},{"id":"p14","t":"pay","day":3,"ref":"4.1–4.2","title":"Pazarlar ve işlem esasları","pts":["Kriter (2026): **Yıldız** PD > 6 milyar, FDPD > 1 milyar TL; **Ana** PD > 1 milyar, FDPD > 400 milyon TL; ikisinde FDO %10. Her pay pazarın tüm kriterlerini sağlamalı.","Değerlendirme yılda en az iki kez; yeni işlem görmeye başlayan 3 ay dahil edilmez.","**YİP** nedenleri: iki dönem olumsuz/kaçınılan görüş, 3 aydan fazla durma, 5 yıl net zarar, lisans iptali, ilişkili alacak aktifin %50'sini aşması.","**GSP**: yalnız nitelikli yatırımcılar. **PÖİP**: halka açık olup borsada işlem görmeyenler.","Yöntem: Yıldız-Ana-Alt sürekli; YİP-PÖİP 5 kez tek fiyat.","Marj: Yıldız %20, Ana %15, diğerleri %10. 2020/20 duyurusuyla Yıldız ve Ana'da geçici %10 uygulanır.","Devre kesici oranı: Yıldız %10, Ana %7,5, Alt %5; geçici uygulamada Yıldız ve Ana'da %5.","Açığa satış ve kredi: Yıldız ve Ana'da var. Brüt takas: Alt, YİP, PÖİP. Özkaynak oranı: Yıldız %90, Ana %75. Açık takas pozisyonu oranı: Yıldız %20, Ana %50, diğerleri %100."],"must":["Tek kriterin üstünde olmak yetmez, pazarın bütün kriterleri birlikte aranır.","Alt, YİP ve PÖİP'te ilk işlem öncesi bilgilendirme metni beyanı alınır."],"mn":"Marjı merdiven gibi çalış: **20-15-10**. Yanına geçici %10 notunu düş."},{"id":"p15","t":"pay","day":3,"ref":"4.3–4.5","title":"Fiyat, seans ve işlem yöntemi","pts":["1 TL nominal = 1 adet = 1 lot. Baz fiyat önceki gün kapanışıdır. Rüçhanda marj %50; ilk gün baz fiyat uygulanmaz.","Fiyat adımı: 20 TL altı 0,01; 20-49,999 için 0,02; 50-99,999 için 0,05; 100-249,999 için 0,10; 250-499,999 için 0,25; 500-999,999 için 0,50; 1.000-2.499,999 için 1; 2.500 ve üzeri 2,50.","Limit hesabı: marj = baz × oran. Üst limit aşağı, alt limit yukarı yuvarlanır (aralık daralır).","Sürekli seans: açılış 09:40-10:00, emir toplama 09:40-09:55; sürekli işlem 10:00-18:00; kapanış 18:00-18:07; kapanış fiyatından işlem 18:07-18:10; birincil piyasa 10:30-13:00.","Tek fiyatta işlem ancak süre sonunda olur; fiyat belirleme aşamasında emir girilemez, değiştirilemez, iptal edilemez. Açılışın son 5 dakikasında iptal, fiyat kötüleştirme ve miktar azaltımı yok.","Açılış fiyatı sırası: en çok işlem → en az kalan emir → piyasa yönü → referansa yakınlık.","Açılış hesabına girmeyen emirler: küsurat, hepsi ya da hiçbiri, gerçekleşmezse iptal et, gösterge, dengeleyici, tetiklenmemiş stop.","Kapanış seansında emir son işlem fiyatının **±%3**'ü içinde ve günlük sınırlar içinde olmalıdır."],"must":["Yuvarlama daima içeri.","Kapanış marjı ±%3 ile günlük limit birlikte uygulanır."],"mn":"Açılış sırası \"Miktar-Kalan-Yön-Referans\": MKYR. Eşitlik bozulana kadar sıradaki kurala geç."},{"id":"p16","t":"pay","day":3,"ref":"4.6–4.7","title":"Devre kesici ve emirler","pts":["Pay bazında devre kesici yalnız paylarda ve sürekli işlemde çalışır. Rüçhan, varant ve temerrüt sıraları etkilenmez.","Kaynaktaki metin: 10 dakika emir toplama + 2 dakika eşleşme; açığa satılabilen payda seansın kalanında yukarı adım. Tabloda ise pazar bazında süreler (Yıldız 5, Ana-Alt 15 dakika, geçici uygulamada 30 dakika) verilir. Kaynak iki değeri de içerir; sınav öncesi güncel Prosedürü kontrol et.","17:45-18:00 arası tetiklenirse emir toplama 15 dakika, eşleştirme kapanış emir toplaması bitince.","**EBDKS**: BIST 100 önceki kapanışa göre **%6** düşerse. 10 dk durdurma + 5 dk emir toplama + 5 dk içinde eşleştirme. Aynı gün ikinci kez çalışmaz; 18:00'den sonra çalışmaz. 17:30-18:00 tetiklenirse 18:00'e kadar durur.","**Piyasa emri** yalnız KİE gönderilir, kalan iptal. **Piyasadan limite**: yalnız en iyi kademe, kalan son işlem fiyatından limite döner.","**Orta nokta**: 100.000 TL-30 milyon TL, yalnız BIST 30, en iyi alış-satış ortalaması, kapalı defter; fiyat istatistiği yayımlanmaz.","**AOF emri**: 100.000-10 milyon lot, yalnız BIST 30.","**Küsurat**: 1 lottan az, .E sırasındaki son fiyattan. **Kotasyon**: yalnız piyasa yapıcı/likidite sağlayıcı.","Öncelik: fiyat, sonra zaman. Miktar artışı, fiyat değişikliği ve süre uzatma önceliği kaybettirir; süre kısaltma kaybettirmez.","Geçerlilik: günlük, KİE, İKG, tarihli. Emirde hesap numarası zorunlu."],"must":["EBDKS: 10 + 5 + 5, eşik %6, günde bir kez.","Piyasa emri kalanı iptal, piyasadan limite kalanı pasife yazılır."],"mn":"EBDKS \"6'ya 10-5-5\": %6 düşüş, 10 durur, 5 toplar, 5 eşleşir."},{"id":"p17","t":"pay","day":3,"ref":"4.8–4.9","title":"Kredili işlem, açığa satış, brüt takas","pts":["Liste Alt Pazar, PÖİP ve YİP dışındaki payları kapsar.","Pay listeden çıkarsa takip eden üç aylık dönem sonuna kadar Geçici Liste'de kalır; yeni işlem yapılamaz. Geçici kapalılık 5 iş gününden fazla sürerse listeden çıkar.","**Yukarı adım kuralı**: açığa satış son işlem fiyatından yüksek olur; son fiyat bir öncekinden yüksekse son fiyattan da yapılır. Ana Pazar ve BYF'de geçerli, Yıldız'da değil.","Açılış seanslarında açığa satış emri girilemez. BIST 100 **%2** düşerse açığa satılabilen sıralarda yukarı adım seans sonuna kadar otomatik uygulanır.","**Brüt takas**: netleştirme yok; alım için nakit, satım için pay gerekir. Amaç yanıltıcı işlemleri ve gün içi spekülatif al-satı sınırlamak."],"must":["Örnekte son iki fiyat eşitse en düşük açığa satış fiyatı bir adım yukarıdır; son fiyat yükselmişse son fiyattan yapılır.","BIST 100 gün içinde %2 düşerse açığa satılabilen sıralarda yukarı adım seans sonuna kadar uygulanır."],"mn":"\"Düşen fiyata açığa satış yok\": kuralın mantığı bu tek cümle."},{"id":"b1","t":"bor","day":4,"ref":"1.1–1.2","title":"İhraç esasları ve satış","pts":["VII-128.8 Tebliği. Tahvil vade **365 gün ve üzeri**; finansman bonosu **30-364 gün**.","İhraç kararı kural olarak **genel kurul**; SPKn 31 uyarınca esas sözleşmede açıkça devredilirse yönetim kurulu.","Karardan sonra en geç **1 yıl** içinde SPK başvurusu. Yurt dışı ihraçlarda da onay gerekir.","Limit: halka açık **özkaynak × 5**, halka açık olmayan **× 3**. İlk 3 kademede notlu bankada %100 artış.","Kalan limit = azami limit − (tedavüldeki nominal + henüz satılmamış tavan). Konsolide tablo varsa o kullanılır.","İhraç belgesi onaydan **1 yıl** geçerli. Hazine ihraçları bu onaydan muaf.","Tahsisli satış aynı anda en çok **150** yatırımcı; nitelikli yatırımcılar sayılmaz; aşılırsa 20 iş günü içinde izahname ve borsa başvurusu.","Yurt dışı ihraç bilgileri satıştan sonra **3 iş günü** içinde MKK'ya bildirilir. Risk beyanları **5 yıl** saklanır."],"must":["Yetki devri yoksa YK tek başına tahvil kararı alamaz.","Özel sektör izahnamesiz satışı (nitelikli-tahsisli) maliyet ve hız nedeniyle tercih eder."],"mn":"Vadeyi takvimle ezberle: \"bir yıl dolduysa tahvil\"."},{"id":"b2","t":"bor","day":4,"ref":"1.3–1.5","title":"Kamuyu aydınlatma, BASK, ikincil piyasa","pts":["Genel bilgi formu: halka arz ve nitelikli satışta var, tahsiside yok; değişiklik **2 iş günü** içinde.","Madde 21 olayları her ihraççı için; içsel bilgi (genel müdür değişikliği gibi) yalnız halka arz edende.","Pay oranı eşikleri: nitelikli-tahsisli **%25, %50, %67**; halka arz **%5, 10, 15, 20, 25, 33, 50, 67, 95**.","**BASK** (II-31A.1): Tertip ve Genel. İhraççı ve ilişkili tarafların araçları nisaba girmez, oy kullanılamaz.","Karar tedavüldeki nominalin **üçte ikisiyle**; **3 iş günü** içinde YK onayı. Diğer tertipler %20 ile Genel BASK toplatabilir.","Yeniden yapılandırmada icra takipleri durur, ihtiyati tedbir-haciz uygulanmaz, zamanaşımı işlemez, ifa edilince takip düşer.","BAP'ta doğrudan işlem: borsa üyesi banka, aracı kurum ve TCMB. Temel pazar Kesin Alım Satım; Eurotahvil Uluslararası Tahvil Pazarı.","Halka arz edilen araçta borsada işlem zorunlu; nitelikliye satılanda zorunlu değil, borsada görse de nitelikli kısıtı sürer."],"must":["Genel müdür değişikliğini yalnız halka arz eden açıklar.","BASK üç sayısı: 2/3 nisap, 3 iş günü onay, %20 itiraz."],"mn":"Halka arz \"herkese hesap verir\": en çok eşik ve en çok açıklama onda."},{"id":"b3","t":"bor","day":4,"ref":"2","title":"Temel kavramlar","pts":["\"Sabit getirili\" sözünde sabit olan nakit akışını belirleyen formül ve takvimdir; değişken faizli araç da bu gruptadır.","Borçlanma aracı sahibi yönetime katılmaz; tasfiyede pay sahiplerinden önce ödenir.","Kredi taksitli ve çoğu zaman teminatlıdır; tahvilde anapara çoğunlukla vade sonunda balon ödenir ve genelde teminatsızdır.","Tahvilin ek maliyetleri: aracılık komisyonu, derecelendirme, Kurul ücreti, MKK ve KAP, borsa ücretleri.","Nominal değer DİBS ve özel sektörde standart **100 TL**. Kupon daima nominalden hesaplanır.","Değişken kupon = referans oran + spread; faiz riskine daha dayanıklıdır.","Sermaye benzeri araç: vadesiz olabilir; tasfiyede diğer borçlanma araçlarından sonra, paydan önce.","Parçalı itfa ve dengeli borç servisi; TÜFE'ye endeksli anüite 30 yıl vadeli, 3 ayda bir ödeme, doğrudan satışla ihraç."],"must":["Faiz yükselince sabit kuponlu tahvilin fiyatı düşer.","Balon ödeme nakit akışına uygundur, kredide aylık anapara baskısı vardır."],"mn":"Kupon için kural cümlesi: \"Kupon piyasaya bakmaz, nominale bakar.\""},{"id":"b4","t":"bor","day":4,"ref":"3.1–3.3","title":"Fiyatlama ve faiz","pts":["**İşlemiş faiz** = nominal × yıllık kupon × gün / 365. Gün son kupondan takasa kadar, takas günü hariç.","**Kirli = temiz + işlemiş faiz**. Takasta kirli ödenir, analizde temiz izlenir (testere dişi).","Kuponsuz senette işlemiş faiz yoktur; temiz = kirli.","Kuponsuz fiyat = nominal / [1 + basit faiz × (kalan gün / 365)].","Basit = dönemsel getiri × kupon sayısı. Bileşik = (1 + dönemsel)^kupon sayısı − 1.","Aynı basit faizde kupon sıklığı artarsa efektif getiri artar. %20 basit: yılda 2 kupon %21, yılda 4 kupon %21,55."],"must":["Takas günü sayılmaz.","Dönemsel getiri = yıllık basit / yıllık kupon sayısı."],"mn":"\"Kirli = alıcının cebinden çıkan\", \"temiz = ekranda karşılaştırılan\"."},{"id":"b5","t":"bor","day":4,"ref":"3.4–3.7","title":"Getiri ölçütleri","pts":["Nominal getiri = kupon / nominal. Cari getiri = kupon / piyasa fiyatı. YTM: nakit akışlarının bugünkü değerini fiyata eşitleyen orandır.","İskontolu: **YTM > cari > nominal**. Primli: **nominal > cari > YTM**. Başabaş: üçü eşit.","YTM'nin iki varsayımı: vadeye kadar tutulur, kuponlar YTM'yle yeniden yatırılır. Kuponsuzda yeniden yatırım riski yoktur.","Fisher: reel = (1 + nominal) / (1 + enflasyon) − 1. Doğrusal yaklaşım yüksek enflasyonda reeli olduğundan yüksek gösterir.","Net getiri = brüt × (1 − stopaj). Mevduat eşleniği = net / (1 − mevduat stopajı).","1 baz puan = %0,01; 100 baz puan = %1."],"must":["Sıralamayı fiyatla düşün: ucuz aldıysan YTM en yüksek."],"mn":"Fiyat düşükse \"YTM tepede\", fiyat yüksekse \"YTM dipte\"."},{"id":"b6","t":"bor","day":4,"ref":"4.1–4.4","title":"Risk, durasyon, risksiz faiz","pts":["Kupon < piyasa faizi: iskontolu. Kupon > piyasa faizi: primli.","Beklenen getiri = piyasa faizi + kredi primi + likidite primi. Faiz riski ihraççıdan bağımsızdır.","Gösterge tahvil daha likittir; eski tahvil (off-the-run) daha az.","Kısa faizi merkez bankası, uzun faizi beklentiler ve ülke riski etkiler; küresel koşullar da etkilidir.","**Durasyon**: nakit akışlarının bugünkü değer ağırlıklı ortalama vadesi. Vade uzarsa artar; kupon yükselirse azalır; YTM yükselirse azalır.","Düzeltilmiş durasyon: faizdeki %1'lik değişimin yaklaşık fiyat etkisi. Büyük değişimde konveksite eklenir.","Risksiz faiz kredi riskinden arındırılmış referanstır; vade yatırımla uyumlu olmalıdır. Türkiye'de TL DİBS karşılığıdır."],"must":["Kuponsuz tahvilin durasyonu yüksektir."],"mn":"Durasyon için \"uzun ve düşük kupon = hassas\"."},{"id":"b7","t":"bor","day":4,"ref":"4.5–4.7","title":"Kredi notu, CDS, erken itfa","pts":["Yatırım yapılabilir: AAA, AA, A, BBB (Moody's Aaa-Baa). Spekülatif: BB ve altı. D temerrüt.","Kaynaktaki tarihsel temerrüt: BBB %0,45, BB %1,96; yaklaşık 4 kat sıçrama.","Derecelendirme kuruluşu notu vade boyunca yılda en az bir kez gözden geçirir.","Ulusal ölçek yalnız ülke içi karşılaştırır.","**CDS**: tezgâh üstü türev, hukuken sigorta değil. Koruma alıcısı prim öder; kredi olayında satıcı tazmin eder. Türkiye CDS'i Eurotahvillere dayanır. En likit vade 5 yıl.","CDS anlık beklentiyi yansıtır, kredi riskinin öncü göstergesidir.","Eurotahvilde beklenen getiri = risksiz faiz + CDS primi.","**Call** hak ihraççıda, kupon yüksek. **Put** hak yatırımcıda, kupon düşük. Sıra: call > opsiyonsuz > put."],"must":["350 baz puan CDS = %3,50.","Call yatırımcıya yeniden yatırım riski, put ihraççıya yeniden finansman riski getirir."],"mn":"\"Call = ihraççı çağırır\", \"Put = yatırımcı geri itekler\"."},{"id":"b8","t":"bor","day":4,"ref":"5.1–5.3","title":"Eurotahvil, STRIP, getiri eğrisi","pts":["Eurotahvil: \"euro\" para birimi değil, uluslararası teamüldür. Euroclear ve Clearstream'de saklanır.","Kupon çoğunlukla stopajsız brüt ödenir; yatırımcının ülkesinde vergi doğabilir. USD ihraçlarda kupon genellikle 6 ayda bir, euro'da yılda bir.","ICMA kuralları, takas çoğunlukla T+2; Hazine USD ihraçlarında gün sayımı **30/360**.","**STRIP**: kupon ve anapara ayrılır. Kodlar: T bütün, A anapara, K kupon. Her parça kuponsuz gibi fiyatlanır, yeniden yatırım riski taşımaz.","Getiri eğrisi normalde pozitif eğimlidir. **Ters eğri** kısa faizin uzundan yüksek olmasıdır; sıkı para döneminde görülür, resesyonun öncü göstergesidir."],"must":["30/360 işlemiş faiz = nominal × kupon × gün / 360."],"mn":"STRIP kodları \"TAK\": Tüm, Anapara, Kupon."},{"id":"b9","t":"bor","day":4,"ref":"5.4–5.6","title":"TLREF ve endeksli araçlar","pts":["**TLREF**: BIST Repo-Ters Repo Pazarı, aynı gün başlangıç valörlü, DİBS teminatlı gecelik işlemlerin hacim ağırlıklı ortalaması. Uçlardan %15'er atılır, %70 kalır.","**TLREFK**: Taahhütlü İşlemler Pazarı; uçlardan %10'ar atılır, %80 kalır.","Veri yetersizse TLREF'te TCMB Ortalama Fonlama Faizi, TLREFK'te TLREF kullanılır.","SOFR ABD Hazine reposu verisinden; Euribor hibrit yöntemle. Yeni gecelik oranlar geriye dönüktür.","BIST TLREF Endeksi(t) = Endeks(t−1) × [1 + R × g / 365]; hafta sonu g = 3.","TLREF'li kupon: T-1 kuralıyla endeks getirisi + spread × gün / 365. Kupon = nominal × toplam.","**TÜFE'ye endeksli DİBS**: kupon ve anapara endekslenir; reel faiz sabit. TÜFE 2 ay gecikmelidir. Anapara nominalin altında ödenmez.","Kupon = nominal × endeks katsayısı × dönemsel reel faiz."],"must":["TLREF: %15 + %15 atılır, %70 kalır.","Endeks değerleri kupon tarihlerinden bir iş günü öncesinden alınır."],"mn":"TLREF \"15-70-15\", TLREFK \"10-80-10\"."},{"id":"b10","t":"bor","day":4,"ref":"5.7–5.8","title":"DİBS ihracı ve piyasa yapıcılar","pts":["Dört yöntem: ihale, TAP, doğrudan satış, halka arz.","**Çoklu fiyat**: herkes kendi teklif fiyatından alır. **Tek fiyat**: kazanan en düşük fiyat tekliflerinden herkese.","TAP ilk kez Ekim 1988; Merkez Bankası depolar, satılana dek mülkiyet Hazine'de; yalnız piyasa yapıcılar katılır.","Doğrudan satış 1996'da başladı; kime ve ne kadar satılacağı baştan bellidir.","Halka arz 1994 krizinden sonra önem kazandı; yalnız piyasa yapıcılar aracılık eder.","Piyasa yapıcı yükümlülükleri (3): ihaleye katılmak, BAP'ta kotasyon vermek, istenen veri ve raporu iletmek.","Ayrıcalıklar (7): teminatsız ihale, ROT, ihale sonrası teklif, Hazine'nin nakit işlemleri, TAP, halka arz aracılığı, geri alım ve değişim ihaleleri."],"must":["ROT'u yalnız kamu kurumları ve piyasa yapıcılar verebilir."],"mn":"Yöntemleri yıl sırasına diz: TAP 1988 → halka arz 1994 → doğrudan satış 1996."},{"id":"f1","t":"fon","day":5,"ref":"1","title":"Kolektif yatırım ve fonun yapısı","pts":["Kolektif yatırım kuruluşları: yatırım fonları ve yatırım ortaklıkları. PYŞ ve saklama kuruluşu bu tanıma girmez.","Faydalar: profesyonel yönetim, düşük maliyet, risk yönetimi, ek kazanç.","Ayrı tüzel kişilik varsa yatırım ortaklığı; tüzel kişiliksiz, PYŞ'nin kurucu olduğu yapı yatırım fonudur.","Fon (SPKn 52): inançlı mülkiyetle işletilen, iç tüzükle kurulan, tüzel kişiliği olmayan mal varlığı. Tapu ve sicil işlemlerinde sınırlı tüzel kişi sayılır; PYŞ ve saklayıcı müşterek imzalar.","Katılma payı sahibinin fon yönetimine katılma hakkı yoktur.","Kuruluş şartları: saklama anlaşması ve iç tüzüğün Kurulca onayı.","Saklayıcı malvarlığını ayrı izler; ihraç-itfa, birim pay değeri, gelir kullanımı ve talimatları denetler. Önemli aykırılığı Kurula bildirir.","Beş ilke: riskin dağıtılması, profesyonel yönetim, portföy yatırımları, inançlı mülkiyet, mal varlığının korunması.","SPKn 53: fon mal varlığı rehnedilemez (kredi, türev, açığa satış istisnası), haczedilemez, tedbir konulamaz, iflas masasına girmez."],"must":["Fon portföyü PYŞ ve saklayıcı malvarlığından ayrıdır; kamu alacağı için bile haczedilemez."],"mn":"Fon \"şirket değil, kasa\": kasanın anahtarını PYŞ, kilidini saklayıcı tutar."},{"id":"f2","t":"fon","day":5,"ref":"2","title":"Portföy sınırları","pts":["Tek ihraççı en çok **%10**.","**5/40**: %5'i aşan ihraççılar toplamı %40'ı aşamaz.","Aynı grup **%20**. Tedavül limiti: ihraççının tedavüldeki borçlanma aracının en çok %10'u.","TCMB, Hazine, Varlık Fonu, ipotek finansmanı kuruluşları: genel sınır yok, tek tertip %35.","İpotek/varlık teminatlı: tek ihraççı %25, 5/40 yok. Varlık kiralama: tek %25, grup %35, 5/40 yok.","Mevduat toplam %10, tek banka %3 (katılım fonunda %25 ve %10).","Banka sermaye benzeri araç: yalnız borsada işlem gören; toplam %10, tek ihraççı %5.","Bir fon şirket sermayesi veya oyunun %10'undan fazlasına sahip olamaz; aynı PYŞ ve tek kurucunun fonları birlikte %20.","Serbest fonlar genel olarak muaftır."],"must":["5/40 testi: %5'i geçenleri topla, 40'ı aşıyorsa işlem yok.","Tedavül limiti fon değerine değil, ihraççının tedavüldeki toplamına göre bulunur."],"mn":"\"10-5/40-20\": tek, küme, grup. Üç sayıyı tek nefeste söyle."},{"id":"f3","t":"fon","day":5,"ref":"3","title":"PPF, KVBAF ve borçlanma fonları","pts":["Geri fiyat: PPF ve KVBAF. Son ilan edilen fiyattan, T+0 olabilir.","**PPF**: ağırlıklı ortalama vade en çok **45 gün**, tek varlık **184 gün**, DİBS asgari %10, mevduat toplam %50, tek banka %6.","**KVBAF**: ortalama vade **25-90 gün**, tek varlıkta sınır yok, mevduat toplam %10, tek banka %3.","İkisine de vadesi belirsiz varlık ve sermaye benzeri araç alınamaz.","Ters repo: Repo-Ters Repo Pazarı %100, Pay Senedi Repo Pazarı %25.","TEFAS zorunluluğu PPF ve KVBAF'te yok; blokaj uygulanamaz; otomatik alım-satım yapılabilir.","Borçlanma araçları fonu: en az %80. Orta vade 91-730 gün, uzun 730 günden fazla.","Eurobond fonu: kur, CDS, küresel faiz. Yabancı borçlanma fonu: en az %80 yabancı ihraççı; yabancı kamuya %35 istisnası.","**Yan hesap**: %100 karşılık ve varlık fon değerinin %5'ini aşmalı. Tahsilat o tarihte fonda olanlara gider. Gider kurucunundur."],"must":["PPF'de 184 gün sınırı, KVBAF'te yok.","Yan hesapta iki şart birlikte aranır."],"mn":"PPF için **45 / 184 / 50 / 6**, KVBAF için **25-90 / yok / 10 / 3**. Kartı ters çevirip yaz."},{"id":"f4","t":"fon","day":5,"ref":"4.1–4.6","title":"Hisse, endeks, BYF, iştirak, sektör","pts":["Hisse senedi fonu en az %80 pay. **Yoğun fon** en az %80 BIST payı (MKYO hariç); unvanda belirtilir.","**Endeks fon**: en az 6 ihraççı, tek hisse en çok %30, korelasyon en az %90.","Endeks fon gün sonu tek fiyat, TEFAS; **BYF** borsada anlık, T+2, NAD'dan sapabilir.","**İştirak fonu**: %20 grup ve 5/40 yok; %10 tek ihraççı sürer. Risk grup korelasyonudur.","**Sektör fonu**: en az %80 sektör; tek şirket %20; 5/40 ve grup kısıtı yok.","İşlem sırası kapanan pay: ilk 5 işlem günü son fiyat; 6. iş gününden itibaren karşılık.","Karşılık süresi: ağırlık %1'e kadar 1 gün, %1-5 arası 30 gün, %5 üstü 90 gün; günlük eşit tutar."],"must":["Endeks fonda %18 tek hisse yasaldır; sektör fonunda da.","Sektörde 20, endekste 30, iştirakte 10."],"mn":"Tek hisse tavanı: \"Standart 10, sektör 20, endeks 30\": on'ar on'ar çıkar. İştirak standart kalır."},{"id":"f5","t":"fon","day":5,"ref":"4.7–4.9","title":"Değişken, karma, fon sepeti","pts":["**Değişken fon**: asgari oran yok; bir varlık %0, diğeri %100 olabilir. Ölçüt yerine eşik değer belirlenebilir.","**Karma fon**: en az iki grup, her biri en az %20; iki grup toplamı en az %80.","Değişken şemsiye: bir PYŞ her risk grubundan en fazla bir fon, toplam 4 fon.","**Fon sepeti**: tek fon en çok %20; başka sepete yatırım yok; bir fonun paylarının en çok %25'i; serbest fon %10.","Yatırılan fonların ücretleri sepetin toplam gider oranına girer."],"must":["Sepette limit = fon toplam değeri × %20; serbest fon × %10."],"mn":"Karma \"20-20-80\": iki ayak, ikisi de sağlam."},{"id":"f6","t":"fon","day":5,"ref":"5","title":"Katılım, serbest, kâr payı ödeyen","pts":["**Katılım fonu** faize dayalı olmayan araçlar; mevduat, tahvil ve faizli repo yok. Danışman veya Danışma Kurulu onayı.","**Mahzurlu gelir** arındırılır, hayır kurumlarına aktarılır, **5 iş günü** içinde KAP'ta açıklanır; toplam gider oranına girmez.","Katılım PPF: DİBS zorunluluğu yok; tek banka **%20** (konvansiyonelde %6).","**Serbest fon** yalnız nitelikli yatırımcı. Tek ihraççı ve grup limiti yok, kaldıraç esnek, açığa satış serbest, opsiyon satıcısı olabilir.","Gayrimenkul ve girişim fonlarına en çok %25. Fiyat açıklaması en az ayda bir olabilir. Özel emir ve toptan alımda alıcı olamaz.","TEFAS'ta işlem görse de yalnız nitelikli yatırımcıya satılır; MKK teyidi gerekir.","**Kâr payı ödeyen fon**: ödeme günü birim değer ödeme kadar düşer; toplam varlık değişmez; bileşik getiri fırsatı kaybolur."],"must":["100 TL'lik pay 5 TL kâr payı öderse 95 TL olur.","Serbest fonda tek hisseye %35 ve opsiyon yazıcılığı yasaldır."],"mn":"Serbest fon \"nitelikli kapıdan girer, içeride kural az\"."},{"id":"f7","t":"fon","day":5,"ref":"6","title":"Fiyat, kritik saat, valör, TEFAS","pts":["**İleri fiyat**: PPF ve KVBAF dışındaki menkul kıymet fonlarında; emirden sonraki ilk hesaplanan fiyat.","Kritik saat genellikle 13:30; fondan fona değişir. Sonrası T+1 verilmiş sayılır.","Nakit takası = fiyatın oluştuğu gün + valör.","**Nemalandırma** zorunlu; yazılı talebiyle yapılmayabilir. Katılım fonunda uygun araç yoksa nakit bekler.","Döviz fonu: en az %80 yabancı araç ve unvanda (Döviz).","TEFAS'ı Takasbank işletir. İşlem göremeyenler: özel fon, GYF, GSYF, garantili ve koruma amaçlı fonlar."],"must":["Pazartesi 14:00 (kritik saatten sonra), T+2: fiyat Salı, nakit Perşembe."],"mn":"Önce \"fiyat günü\"nü bul, sonra valörü ekle."},{"id":"f8","t":"fon","day":5,"ref":"7.1–7.6","title":"Giderler ve performans","pts":["Yönetim ücreti günlük kesilir, fon zarar etse de alınır.","Yıllık azami: PPF %1,65; endeks-altın-garantili %2,19; KVBAF %2,56; diğer %3,65; fon sepeti %4,38.","Kontrol 3, 6, 9, 12 aylık dönem sonunda; aşım **5 iş günü** içinde iade; sorumlu kurucu ve saklayıcı.","KAP: gider bilgisi 6 iş günü, komisyon bilgisi 10 iş günü.","**Karşılaştırma ölçütü**: endeks getirileri × ağırlık toplamı. Pay unsuru varsa getiri endeksi kullanılır.","**Eşik değer**: tutarlı endeks yoksa; gecelik TL referans faizin bileşik getirisinden düşük olamaz. Serbest ve özel fonda isteğe bağlı.","**Performans ücreti**: nispi getiri × en çok %20. Şart: nispi getiri pozitif ve yüksek iz değer aşılmış.","Hesapta İlk Giren İlk Çıkar; ilk yüksek iz değer alış fiyatı."],"must":["Hisse fonu \"diğer\" gruptadır, %3,65.","Nispi %6 ise azami ücret %1,20."],"mn":"Gider sırası: \"Para 1,65 < Endeks 2,19 < Kısa 2,56 < Diğer 3,65 < Sepet 4,38\"."},{"id":"f9","t":"fon","day":5,"ref":"7.7–7.9","title":"Risk değeri","pts":["Risk değeri 1-7. 5 yıl haftalık getiri (T = 260); garantili ve koruma amaçlıda iki haftalık.","Yıllık volatilite = haftalık standart sapma × √52 (yaklaşık 7,211).","Aralıklar: 1: 0-2, 2: 2-5, 3: 5-10, 4: 10-15, 5: 15-20, 6: 20-30, 7: 30+.","Son **4 ay** ölçümleri farklı kategoriye işaret ederse güncelleme zorunlu. Strateji değişikliğinde beklemeden yeniden belirlenir.","5 yıllık veri yoksa ölçüt getirileriyle tamamlanır."],"must":["Haftalık %2,5 → yıllık yaklaşık %18 → risk 5."],"mn":"Sınırlar: \"2-5-10-15-20-30\"."},{"id":"t1","t":"tur","day":6,"ref":"1","title":"Türev piyasa ve VİOP","pts":["Spot: ödeme teslimde. Türev: ileri tarihte, önceden belirlenen şartlarla. Değer dayanak varlıktan gelir.","Tezgâh üstü esnek, karşı taraf riskli; organize piyasa standart, güvenceli.","Dört ürün: forward (OTC), futures (organize), opsiyon (ikisi de), swap (ikisi de).","VİOP'ta en çok işlem endeks (XU30), sonra döviz.","Takasbank **Merkezi Karşı Taraf**: alıcıya satıcı, satıcıya alıcı olur. Müşteri ve portföy hesapları ayrıdır."],"must":["Forward: karşı taraf riski var. Futures: Takasbank güvencesi."],"mn":"\"Standart = Takasbank = güven\", \"Esnek = OTC = risk\"."},{"id":"t2","t":"tur","day":6,"ref":"2","title":"Vadeli işlem temelleri","pts":["Uzun alım, kısa satım yönlüdür; vadeli işlem yapan varlığın sahibi olmaz.","Sıfır toplamlı: bir tarafın kârı diğerinin zararı. Pozisyon ters işlemle kapanır.","**Günlük uzlaşı** futures'ta var, forward'da yok.","Sözleşme kodu: F_ + dayanak + AAYY. F_XU0300626 BİST 30, Haziran 2026.","Büyüklük: pay 100, endeks × 10, USD/TL 1.000 USD, TL/gram altın 1 gram, gümüş 10 ons, bakır 0,1 ton.","Sözleşme değeri = fiyat × büyüklük; pozisyon = adet × değer. Kâr/zarar = fark × büyüklük × adet.","Gün sonu uzlaşma fiyatı kapanıştan farklıdır.","Açık pozisyon: yeni-yeni artar; kapatan-kapatan azalır; kapatan-yeni değişmez.","Nakdi uzlaşı ve fiziki teslimat. Vade taşıma strateji emri yalnız BİST 30, Dolar/TL, Dolar/Ons altın."],"must":["Hacim yüksek ama açık pozisyon düşüyorsa taraflar pozisyon kapatmıştır."],"mn":"Açık pozisyon \"koltuk sayısı\": yeni iki kişi gelirse artar, ikisi kalkarsa azalır, biri devrederse aynı."},{"id":"t3","t":"tur","day":6,"ref":"3","title":"Teminat","pts":["Başlangıç teminatı = pozisyon × PSR. Kaldıraç = 1 / PSR.","Komisyon teminattan değil, pozisyon büyüklüğünden alınır.","**Çağrı**: gün sonu teminat başlangıç teminatının altına düşerse. Ertesi iş günü **15:00**; fiziki teslimatlı döviz ve yarım günde **11:00**.","Tamamlama nakit TL ile ya da pozisyon azaltılarak.","Gün içi sürdürme seviyesinin altında emirler iptal olur, yeni pozisyon açılamaz. Gün içi çağrı 2 saat.","Çağrı hesabı: zarar → kalan teminat → yeni başlangıç teminatı → fark.","Fiyat boşluğunda eksi bakiye yatırımcının aracı kuruma borcudur. Foreks'te aracı kurum alacaklı olamaz.","**Nemalandırma**: yalnız TL nakit, 15:40'ta hesapta olmalı, zorunlu karşılık düşülür."],"must":["Çağrıyı yeni fiyattan hesaplanan başlangıç teminatına göre bul."],"mn":"Çağrı dört adım: \"Zarar-Kalan-Yeni-Fark\"."},{"id":"t4","t":"tur","day":6,"ref":"4","title":"Sözleşmeler ve vadeli fiyat","pts":["**BİST 30**: çift aylar, en yakın üç vade, nakdi uzlaşı, akşam seansı.","**Pay vadeli**: 3 vade, **fiziki teslimat**, T+2. Sermaye artırımında N1/N2 sözleşmelere aktarılır. Nakit temettüde düzeltme yok.","**Dolar/TL**: 1.000 USD, nakdi, 16 aya kadar. Fiziki teslimatlıda gerçek kişi taraf olamaz. Esnek vade en fazla 364 gün.","Kıymetli maden: çift ay, üç vade, nakdi. TL/gram altın akşam seansında değil.","Vadeli = spot + faiz maliyeti − varlık getirisi. Faiz: piyasa fonlama maliyeti; basit.","Vade yaklaştıkça vadeli spota yaklaşır, vadede eşitlenir.","Temettü faizden büyükse vadeli spotun altında olabilir; piyasa hatası değildir.","Arbitraj: pahalıyı sat, ucuzu al."],"must":["Endeks nakdi, pay fiziki."],"mn":"\"Bugün al, faizi öde, temettüyü geri ver\": formül bu cümledir."},{"id":"t5","t":"tur","day":6,"ref":"5.1–5.6","title":"Opsiyonlar","pts":["Alıcı hakkı alır, primi öder, prim geri gelmez. Satıcının yükümlülüğü koşulludur.","**Call** alma, **put** satma hakkı. Amerikan tipi her an, Avrupa tipi vadede.","Prim etkisi (call/put): dayanak +/−, kullanım −/+, vade +/+, volatilite +/+, faiz +/−, temettü −/+.","Call alıcısı kârı sınırsız, zararı prim. Satıcının kârı prim, zararı büyük.","Net kâr: call (spot − kullanım) − prim; put (kullanım − spot) − prim.","**Kârda**: call'da kullanım < spot; put'ta kullanım > spot. Kârda olmak net kâr değildir.","Borsada Takasbank karşı taraftır; tezgâh üstünde alıcı kredi riski taşır."],"must":["Volatilite ve vade her iki opsiyonu da artırır."],"mn":"Hak alanın zararı \"cebindeki prim kadar\", yazanın kârı \"aldığı prim kadar\"."},{"id":"t6","t":"tur","day":6,"ref":"5.7","title":"Varantlar","pts":["Varant ihraççı kurumun çıkardığı menkul kıymetleştirilmiş opsiyondur; türev piyasa ürünü değil.","Pay Piyasası'nda spot esaslarıyla işlem görür, VİOP'ta değil.","Özelliklerini ihraççı belirler; standart vade yoktur.","Yatırımcı yalnız prim öder, teminat tamamlama yoktur, azami riski primdir.","Yatırımcı ihraççı olamaz; ihraççı yatırım kuruluşu veya halka açık ortaklıktır."],"must":["Opsiyonda herkes yazıcı olabilir, varantta olamaz."],"mn":"Varant \"tek satıcı, çok alıcı\"."},{"id":"g1","t":"g67","day":6,"ref":"1","title":"Kapsam","pts":["G67 tevkifat yöntemini belirler: banka veya aracı kurum keser.","Kapsam dışı: hisse kâr payı, Eurobond, tam mükellef kurumların BIST payını 1 yıldan fazla tutması, %51 hisse fonunun 1 yıl üstü satışı (TEFAS dışı serbest fon hariç), yurt dışı kurum tahvili, 1.1.2006 öncesi ihraç ve iktisap.","Tevkifat herkese uygulanır; vergiden muaf olanlara da."],"must":["Muaf olmak vergisiz demek değildir."],"mn":"Kapsam dışını üç soruyla ara: Yurt dışı mı? 2006 öncesi mi? Bir yıldan fazla mı?"},{"id":"g2","t":"g67","day":6,"ref":"2","title":"Matrah","pts":["Matrah = satış − alış − komisyon ve BSMV; başka gider düşülmez.","**FİFO**: ilk alınan ilk satılır.","Dövize endeksli: işlem tarihindeki TL karşılıkları. Yabancı para cinsi: kur farkı dikkate alınmaz.","Zarar mahsubu: aynı tür, üç aylık dönem; takvim yılı aşılmaz, son dönem zararı ertesi yıla geçmez.","Dört grup: sabit getirili, değişken getirili, diğer, fon ve yatırım ortaklığı.","Hisse, hisse endeksine dayalı vadeli-opsiyon, hisse dayanaklı BIST varantı ve hisse yoğun fon aynı gruptadır."],"must":["Devlet tahvili ile hisse zararı mahsup edilmez."],"mn":"Mahsup \"aynı aile, çeyrekten çeyreğe, aynı yıl\"."},{"id":"g3","t":"g67","day":6,"ref":"3","title":"Hisse, yatırım ortaklığı, vadeli","pts":["Kâr payı G67 dışı; GVK 94'e göre **%15**. Tam mükellef kurumdan alınanın %50'si istisna; kalan 330.000 TL'yi (2025) aşarsa beyan; stopajın tamamı mahsup.","Yurt dışı şirket kâr payında %50 istisna için en az %50 sermaye ve transfer şartı.","1.1.2006 sonrası iktisap BIST hisse satış kazancı: **%0**, beyan yok.","MKYO hissesi **%10**; diğer yatırım ortaklıkları %0.","Vadeli ve opsiyon: hisse-hisse endeksi %0, diğer %10."],"must":["Hisse dayanaklı BIST varantı %0; kaynağın örneğinde döviz varantı %10."],"mn":"\"MKYO istisnası\": hisse ailesinde tek %10."},{"id":"g4","t":"g67","day":6,"ref":"4","title":"Tahvil ve bonolar","pts":["1.1.2006 sonrası ihraç devlet tahvili ve Hazine bonosu: **%10**, nihai.","Hazine ihraçları 22.12.2021-30.06.2026 (dahil) iktisap: **%0**. Belirleyici iktisap tarihidir.","Altına dayalı DİBS %0.","**Eurobond** G67 dışı, beyanla vergilenir. Faiz 330.000 TL'yi aşarsa; alım-satım kazancı endeksleme sonrası kalan tutar ne olursa olsun.","Özel sektör tahvili %10, SPK onaylı finansman bonosu **%15**. Yurt dışı ihraç tevkifata girmez.","Banka ihraçlarında indirimli oran bitti; 1.2.2025 itibarıyla genel oranlar."],"must":["Eurobond stopajla nihai vergilenmez."],"mn":"30 Haziran 2026 tarihini \"%0 kapısı\" diye kodla."},{"id":"g5","t":"g67","day":6,"ref":"5","title":"Kira, varlığa dayalı, fon","pts":["Kira sertifikası %10; 1 yıldan kısa %15; altına dayalı %0; 4749'a göre ihraç 22.12.2021-30.06.2026 %0.","VDMK-İDMK %10. Darphane sertifikası %0.","Fon: 1.2.2025'ten itibaren %15; 9.7.2025'ten itibaren **%17,5**.","Hisse yoğun fon %0. GYF ve GSYF 2 yıldan fazla %0. %51 hisse fonu 1 yıl üstü kapsam dışı."],"must":["1 yıllık sürede iktisap tarihi esastır."],"mn":"Fon için üç eşik: tarih (9.7.2025), tür (yoğun), süre (1-2 yıl)."},{"id":"g6","t":"g67","day":6,"ref":"6","title":"Mevduat, katılım, repo","pts":["TL mevduat (9.7.2025 sonrası): vadesiz ve 6 aya kadar **%17,5**, 1 yıla kadar **%15**, 1 yıldan uzun **%10**.","Döviz tevdiat **%25**, vade ayrımı yok.","Enflasyona bağlı değişken faizli 1 yıldan uzun hesap %0.","Kur korumalı ve altın dönüşümlü hesaplar 17,5 ve 15.","Katılma hesabı mevduatla aynı; döviz katılma %25; faizsiz kredi ve kâr-zarar belgesi %15.","Repo **%15**."],"must":["Oran hesabın açıldığı veya yenilendiği tarihe göre belirlenir."],"mn":"Vade uzadıkça oran düşer: 17,5 → 15 → 10."},{"id":"g7","t":"g67","day":6,"ref":"7","title":"Ticari kazanç ve ihtiyari beyan","pts":["Ticari faaliyet gelirinde beyanname verilir, stopaj mahsup edilir.","Dar mükellef vergi kimlik numarası alır; anlaşmadan yararlanmak için mukimlik belgesi gerekir.","**İhtiyari beyan**: yalnız alım-satım kazancı; faiz ve itfa olmaz. İzleyen yılın Mart ayında. Dar mükellef Boğaziçi Vergi Dairesi.","Oranlar: pay grubu %0, diğer fon %17,5, finansman bonosu ve kısa kira %15, diğer %10.","Aynı tür zararlar mahsup edilir; farklı kurumlardaki işlemler birleştirilebilir.","Süre geçerse iade yok."],"must":["İade = kesilen vergi − hesaplanan vergi."],"mn":"\"Mart ayında mahsup\": işlem yılını izleyen Mart."}],"Q":[{"id":"q1","l":"p1","s":"Bedeli tam ödenmiş %15'lik ortağın şirketi iflas etti. Şirket alacaklısı banka için hangisi doğrudur?","o":["Ortağın kişisel malvarlığına başvuramaz","Ortağın payı oranında haciz koydurabilir","Yalnız ortağın evine haciz koydurabilir","Ortak borcun %15'inden kefil sayılır","Ortak YK üyesi değilse borcun yarısından sorumludur"],"e":"TTK 329: şirket yalnız kendi malvarlığıyla sorumludur. Ortağın tek borcu taahhüt ettiği sermayeyi ödemektir.","m":"Ortak parayı koydu, işi bitti.","c":1},{"id":"q2","l":"p1","s":"Anonim şirkette genel kurulun görevi olmayan hangisidir?","o":["Muhasebe ve finansal denetim düzenini kurmak","Yönetim kurulunu seçmek","Finansal tabloları onaylamak","Bağımsız denetçi seçmek","Esas sözleşme değişikliğine karar vermek"],"e":"Muhasebe ve finansal denetim düzenini kurmak yönetim kurulunun devredilemez görevleri arasındadır.","m":"Günlük iş YK'da, büyük karar genel kurulda.","c":0},{"id":"q3","l":"p1","s":"Tasfiyede paydan önce ödenenler için hangisi doğrudur?","o":["Devlet borçları, çalışan hakları ve borçlanma aracı sahipleri önce ödenir","Pay sahipleri tahvil sahipleriyle eşit sırada ödenir","Pay sahipleri çalışanlardan önce ödenir","Borçlanma aracı sahipleri paydan sonra ödenir","Sıra esas sözleşmeyle serbestçe belirlenir"],"e":"Pay sahibi artık değer hak sahibidir; borçlar ödendikten sonra kalan varsa pay alır.","m":"","c":0},{"id":"q4","l":"p1","s":"Payın nominal değeri için hangisi doğrudur?","o":["TTK 476'ya göre 1 kuruştan az olamaz","En az 1 TL olmak zorundadır","Borsa fiyatına göre her gün değişir","Halka açık şirkette en az 10 TL'dir","Alım satım fiyatını doğrudan belirler"],"e":"Nominal değer 1 kuruştan az olamaz, 1 kuruş ve katları olur. Borsada genellikle 1 TL'dir.","m":"","c":0},{"id":"q5","l":"p1","s":"Hangisi SPKn tanımına göre menkul kıymet kapsamındadır?","o":["Depo sertifikası","Çek","Poliçe","Bono","Para"],"e":"Tanım para, çek, poliçe ve bonoyu dışarıda bırakır; depo sertifikaları dahildir.","m":"\"Para, çek, poliçe, bono\" dörtlüsü hep dışarıda.","c":0},{"id":"q6","l":"p1","s":"Halka açık ortaklıkta yönetim kurulu bünyesindeki komiteler için hangisi doğrudur?","o":["Komiteler organ değildir","Komiteler genel kurulun üstündedir","Murakıplığın yasal adıdır","Zorunlu organ sayılır","Yalnız halka açık olmayan şirkette kurulur"],"e":"Denetim, riskin erken saptanması ve kurumsal yönetim komiteleri organ değildir.","m":"","c":0},{"id":"q7","l":"p2","s":"Oyda imtiyazlı paya, istisnalar hariç, en çok kaç oy verilebilir?","o":["15","5","10","20","50"],"e":"Oyda imtiyazla bir paya en çok 15 oy tanınabilir.","m":"\"15 oy, 3 yasak\".","c":0},{"id":"q8","l":"p2","s":"1.000.000 paylı şirkette 800.000 adi pay, oyda 15 imtiyazlı 200.000 pay vardır. Toplam oy kaçtır?","o":["3.800.000","1.000.000","3.000.000","2.200.000","15.000.000"],"e":"800.000 + (200.000 × 15) = 3.800.000 oy.","m":"Adi × 1 + imtiyazlı × 15.","c":0},{"id":"q9","l":"p2","s":"Hangi kararda oyda imtiyaz kullanılamaz?","o":["İbra","Kâr dağıtımı","Yönetim kurulu seçimi","Bağımsız denetçi seçimi","Olağan genel kurul başkanı seçimi"],"e":"Esas sözleşme değişikliği, ibra ve sorumluluk davası kararlarında kullanılamaz.","m":"","c":0},{"id":"q10","l":"p2","s":"Kurucu intifa payı sahipleri için hangisi doğrudur?","o":["Genel kurulda oy kullanamaz, ekonomik hak alabilir","Genel kurulda 15 oy kullanır","Pay sahibi sayılır","Yönetim kurulu üyesi olmak zorundadır","Net kâra hiç katılamaz"],"e":"Bu kişilere pay sahipliği hakkı verilemez; net kâra, tasfiye bakiyesine katılma veya yeni pay alma hakkı verilebilir.","m":"","c":1},{"id":"q11","l":"p2","s":"300 milyon TL net kârı olan şirketin 150 milyon payından 30 milyonu geri alınmıştır. Tedavüldeki paya göre hisse başına kazanç kaçtır?","o":["2,50 TL","2,00 TL","1,50 TL","3,00 TL","10,00 TL"],"e":"Tedavüldeki pay 120 milyon; 300 / 120 = 2,50 TL. Toplam paya göre 2,00 TL çıkardı.","m":"Kâr aynı, payda küçülür, sonuç büyür.","c":1},{"id":"q12","l":"p2","s":"Geri alınan paylar için hangisi yanlıştır?","o":["Oy hakkı aktif kalır","Bilançoda özkaynaktan indirilir","Kâr payı alma hakkı saklıdır","Yönetimsel hakları da dondurulur","Genel kurul toplantı nisabında dikkate alınmaz"],"e":"Oy hakları ve buna bağlı yönetimsel haklar dondurulur (Tebliğ md. 18).","m":"Donan şey oy; para getiren haklar yaşar.","c":1},{"id":"q13","l":"p2","s":"Hangisi fiili dolaşımdaki paylara dahildir?","o":["Bireysel yatırımcıların borsadaki serbest payları","Hakim ortağın payları","Yönetim kurulu üyelerinin payları","Hacizli paylar","Şirket vakfının payları"],"e":"Dahil edilmeyenler içinde hakim ortak, YK, vakıf ve hacizli paylar vardır.","m":"","c":1},{"id":"q14","l":"p2","s":"BIST endekslerinde şirketin ağırlığı neye göre belirlenir?","o":["Fiili dolaşımdaki payların piyasa değerine","Toplam sermayeye","Nominal değere","Net kâra","Defter değerine"],"e":"Ağırlık toplam sermayeye değil, fiili dolaşımdaki paylara göre hesaplanır.","m":"","c":1},{"id":"q15","l":"p3","s":"Toplam varlığı 900, toplam borcu 400 milyon TL, pay sayısı 100 milyon olan şirketin defter değeri kaçtır?","o":["5,00 TL","9,00 TL","4,00 TL","13,00 TL","1,00 TL"],"e":"(900 − 400) / 100 = 5,00 TL.","m":"Özkaynak ÷ pay.","c":1},{"id":"q16","l":"p3","s":"Değerlemede genellikle alt sınır sayılan değer hangisidir?","o":["Tasfiye değeri","İçsel değer","Nominal değer","Piyasa değeri","Emisyon primi"],"e":"Tasfiye değeri, iflas veya tasfiyede ortağa kalması muhtemel tutarı gösterir; dip fiyat sayılır.","m":"","c":0},{"id":"q17","l":"p3","s":"Bir yatırımcı borsada işlem gören payı için fiziki senet istiyor. Sonuç nedir?","o":["Talep karşılanamaz; mülkiyet MKK'da izlenir","Şirket 30 gün içinde basar","SPK onayıyla basılır","Takasbank senet verir","Note
